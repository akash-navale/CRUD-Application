<div class="row">
    <div class="col-8">
        <div class="card">
            <div class="card-header bg-warning">
                Photos List.
            </div>
            <div class="card-body">
                <table class="table table-bordered">
                    <thead>
                    
                        <tr>
                            <th>Sr.No</th>
                            <th>Title</th>
                            <th>Url</th>
                            <th>Thumnail</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for(item of PhotosList; track $index){
                        <tr>
                            <td>{{$index+1}}</td>
                            <td>{{item.title}}</td>
                            <td>{{item.url}}</td>
                            <td>{{item.thumbnailUrl}}</td>
                            <td>
                                <button class="btn btn-primary m-1" (click)="onEdit(item)">Edit</button>
                                <button class="btn btn-danger m-1"(click)="onDelete(item.id)">Delete</button>

                            </td>

                        </tr>
                        }

                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="col-4">
        <div class="card">
            <div class="card-header bg-warning">
                Photos List
            </div>
            <div class="card-body">
                <form>
                    <div class="row">
                        <div class="col-6">
                            <label>Album Id</label>
                            <input type="text" name="albumId" [(ngModel)]="newPhoto.albumId" class="form-control">
                        </div>
                        <div class="col-6">
                            <label>Title</label>
                            <input type="text" name="Title" [(ngModel)]="newPhoto.title" class="form-control">
                        </div>
                        <div class="col-12">
                            <label>Url</label>
                            <input type="text" name="url" [(ngModel)]="newPhoto.url" class="form-control">
                        </div>
                        <div class="col-12">
                            <label>Thumbnail</label>
                            <input type="text" name="Thumbnail" [(ngModel)]="newPhoto.thumbnailUrl"
                                class="form-control">
                        </div>
                    </div>
                    <div class="row pt-2">
                        <div class="col-6 text-center">
                            <button type="reset" class="btn btn-primary">Reset</button>
                        </div>

                        <div class="col-6 text-center">
                            @if(newPhoto.id == 0){
                            <button type="submit" (click)="onSavePhoto()" class="btn btn-secondary">Save</button>
                            }
                            @else {
                            <button type="submit" (click)="onUpdatephoto()" class="btn btn-primary">Update</button>

                            }

                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
